pipeline:
  name: error-report
  source:
    type: file
    params: { path: data/access-small.log }
  stages:
    - type: parse
      params: { format: clf }
    - type: filter
      params: { field: status, op: ">=", value: 300 }
    - type: project
      params: { fields: [timestamp, clientip, status, path] }
  sink:
    type: file
    params: { path: data/errors.txt }